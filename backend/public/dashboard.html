<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow - Dashboard</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { padding: 10px; background: red; color: white; border: none; cursor: pointer; }
        .user-info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .logout-btn { float: right; }
    </style>
</head>
<body>
    <div class="user-info">
        <span id="userName"></span>
        <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>
    <h1>Tableau de bord</h1>
    <div id="content">
        <p>Bienvenue sur TaskFlow !</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Vérifier si l'utilisateur est connecté
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        // Afficher le nom de l'utilisateur
        document.getElementById('userName').innerHTML = `👋 Bonjour ${user.name || 'Utilisateur'} | <a href="#" id="profileLink">Mon profil</a>`;

        // Déconnexion (demandée par le PDF)
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // Configurer Axios avec le token (demandé par le PDF)
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('token');
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
        });

        // Récupérer le profil utilisateur
        async function loadProfile() {
            try {
                const response = await axios.get('http://localhost:5000/api/auth/me');
                console.log('Profil:', response.data);
            } catch (error) {
                if (error.response?.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            }
        }

        loadProfile();
    </script>
</body>
</html>
