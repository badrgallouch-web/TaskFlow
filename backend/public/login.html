<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow - Connexion</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: green; color: white; border: none; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Connexion TaskFlow</h1>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
    </form>
    <div id="message"></div>
    <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        // Vérifier si un token existe déjà
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = 'dashboard.html';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await axios.post('http://localhost:5000/api/auth/login', {
                    email, password
                });
                
                if (response.data.success) {
                    // Stocker le token dans localStorage (demandé par le PDF)
                    localStorage.setItem('token', response.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.user));
                    messageDiv.innerHTML = '<div class="success">Connexion réussie ! Redirection...</div>';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">' + 
                    (error.response?.data?.message || 'Erreur de connexion') + '</div>';
            }
        });
    </script>
</body>
</html>
