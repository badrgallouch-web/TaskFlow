<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow - Dashboard</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { 
            font-family: Arial;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .logout-btn {
            padding: 10px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .user-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-info #userName {
            flex: 1;
        }
        .logout-btn {
            float: right;
        }
        .logout-btn:hover {
            background: darkred;
        }
        .logout-btn:active {
            background: rgb(104, 15, 15);
        }
        .assign { 
            background: green;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .assign:hover {
            background: darkgreen;
        }
        .assign:active {
            background: rgb(64, 155, 64);
        }
        .task {
            background: orange;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .task:hover {
            background: darkorange;
        }
        .task:active {
            background: rgb(255, 180, 0);
        }
        .member {
            background: blue;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .member:hover {
            background: darkblue;
        }
        .member:active {
            background: rgb(37, 71, 181);
        }
        .filter {
            background: purple;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .filter:hover {
            background: rgb(139, 36, 139);
        }
        .filter:active {
            background: rgb(169, 78, 169);
        }
        .projet {
            background: teal;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .projet:hover {
            background: darkcyan;
        }
        .projet:active {
            background: rgb(0, 128, 128);
        }

    </style>
</head>
<body>
    <div class="user-info">
        <span id="userName"></span>
        <div class="notification-wrap">
            <button type="button" id="notification-bell" title="Notifications">🔔</button>
            <span id="notification-badge"></span>
            <div id="notification-panel">
                <h3>Notifications</h3>
                <div id="notification-list"></div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>
    <h1>Tableau de bord</h1>
    <div id="content">
        <p>Bienvenue sur TaskFlow !</p>

        <a href="index.html">
            <button class="assign">Assigner une tâche</button>
        </a>

        <a href="tasks.html">
            <button class="task">Gestion des tâches</button>
        </a>
        <a href="members.html">
            <button class="member">Gérer les membres</button>
        </a>
        <a href="filter.html">
            <button class="filter">Filtrer les tâches</button>
        </a>
        <a href="projects.html">
            <button class="projet">Créer un projet</button>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-setup.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        document.getElementById('userName').innerHTML = `👋 Bonjour ${user.fullName || 'Utilisateur'} | <a href="#" id="profileLink">Mon profil</a>`;

        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        
        async function loadProfile() {
            try {
                const response = await axios.get(apiUrl('/api/auth/me'));
                console.log('Profil:', response.data);
            } catch (error) {
                if (error.response?.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            }
        }

        loadProfile();
    </script>
</body>
</html>
