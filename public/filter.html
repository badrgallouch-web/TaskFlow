<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Filtrage des tâches</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; padding: 30px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        select, input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #4a90e2; color: white; }
        .pagination { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        .active-page { font-weight: bold; background: #4a90e2; color: white; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Filtrer les tâches</h1>
        <div class="filters">
            <input type="text" id="search" placeholder="Recherche titre...">
            <select id="status">
                <option value="">Tous statuts</option>
                <option value="à faire">À faire</option>
                <option value="en cours">En cours</option>
                <option value="terminé">Terminé</option>
            </select>
            <select id="priority">
                <option value="">Toutes priorités</option>
                <option value="basse">Basse</option>
                <option value="moyenne">Moyenne</option>
                <option value="haute">Haute</option>
            </select>
            <button onclick="filterTasks(1)">Filtrer</button>
        </div>
        <table>
            <thead><tr><th>Titre</th><th>Statut</th><th>Priorité</th><th>Assigné à</th></tr></thead>
            <tbody id="tasksBody"></tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const projectId = localStorage.getItem('currentProjectId');
        if (!token || !projectId) window.location.href = 'login.html';
        
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;

        async function filterTasks(page) {
            const params = {
                page,
                limit: 5,
                search: document.getElementById('search').value,
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value
            };
            try {
                const res = await axios.get(`/api/projects/${projectId}/tasks`, { params });
                const data = res.data.data || [];
                const totalPages = res.data.totalPages || 1;
                const tbody = document.getElementById('tasksBody');
                tbody.innerHTML = '';
                
                data.forEach(task => {
                    tbody.innerHTML += `<tr><td>${task.title}</td><td>${task.status}</td><td>${task.priority}</td><td>${task.assignedTo?.fullName || '-'}</td></tr>`;
                });

                let pagHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    pagHtml += `<button onclick="filterTasks(${i})" ${i === page ? 'class="active-page"' : ''}>${i}</button>`;
                }
                document.getElementById('pagination').innerHTML = pagHtml;
            } catch(err) { 
                console.error(err); 
            }
        }

        filterTasks(1);
    </script>
</body>
</html>
