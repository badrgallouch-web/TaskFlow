<file path="public/members.html">
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Membres</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 450px; padding: 30px; border-radius: 10px; }
        h1, h2 { text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #4a90e2; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
        .remove-btn { background: #e74c3c; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des membres</h1>
        <p id="projectInfo"></p>
        
        <h2>Inviter un membre</h2>
        <input type="email" id="email" placeholder="Email du membre">
        <button onclick="inviteMember()">Inviter</button>
        
        <h2>Retirer un membre</h2>
        <select id="memberSelect"></select>
        <button class="remove-btn" onclick="removeMember()">Retirer</button>
        
        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const projectId = localStorage.getItem('currentProjectId');
        
        if (!token) window.location.href = 'login.html';
        if (!projectId) alert('Sélectionnez un projet d\'abord');
        
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
        document.getElementById('projectInfo').innerText = 'Projet : ' + (localStorage.getItem('currentProjectName') || '');

        async function loadMembers() {
            try {
                const res = await axios.get(`/api/projects/${projectId}`);
                const members = res.data.members || [];
                const select = document.getElementById('memberSelect');
                select.innerHTML = '';
                members.forEach(m => {
                    select.innerHTML += `<option value="${m._id}">${m.fullName} (${m.email})</option>`;
                });
            } catch(err) { 
                console.error(err); 
            }
        }

        async function inviteMember() {
            const email = document.getElementById('email').value;
            const msg = document.getElementById('message');
            if (!email) { msg.className='error'; msg.innerText='Email requis'; return; }
            try {
                await axios.post(`/api/projects/${projectId}/members`, { email });
                msg.className='success'; msg.innerText='Membre ajouté ✅';
                loadMembers();
                document.getElementById('email').value = '';
            } catch(err) {
                msg.className='error'; msg.innerText=err.response?.data?.message || 'Erreur';
            }
        }

        async function removeMember() {
            const userId = document.getElementById('memberSelect').value;
            if (!userId) return;
            if (!confirm('Retirer ce membre ?')) return;
            try {
                await axios.delete(`/api/projects/${projectId}/members/${userId}`);
                document.getElementById('message').innerHTML = '<span class="success">Membre retiré ✅</span>';
                loadMembers();
            } catch(err) { 
                alert('Erreur'); 
            }
        }

        loadMembers();
    </script>
</body>
</html>
