<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Tâches du projet</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; padding: 30px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        h1 { text-align: center; }
        select, button { padding: 8px 12px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #4a90e2; color: white; }
        .status-select { width: auto; display: inline-block; }
        .btn-danger { background: #e74c3c; color: white; border: none; }
        .btn-warning { background: #f39c12; color: white; border: none; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des tâches</h1>
        <p>Projet actuel : <strong id="projectName"></strong></p>
        <a href="tasks-create.html"><button>➕ Nouvelle tâche</button></a>
        <a href="filter.html"><button>🔍 Filtrer</button></a>
        <a href="dashboard.html"><button>⬅ Retour</button></a>

        <h2>Liste des tâches</h2>
        <table id="tasksTable">
            <thead>
                <tr><th>Titre</th><th>Priorité</th><th>Statut</th><th>Assigné à</th><th>Actions</th></tr>
            </thead>
            <tbody id="tasksBody"></tbody>
        </table>
        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const projectId = localStorage.getItem('currentProjectId');

        if (!token) window.location.href = 'login.html';
        if (!projectId) {
            alert('Aucun projet sélectionné');
            window.location.href = 'projects.html';
        }

        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
        document.getElementById('projectName').innerText = localStorage.getItem('currentProjectName') || '';

        async function loadTasks() {
            try {
                const res = await axios.get(`/api/projects/${projectId}/tasks`);
                const tasks = res.data.data || res.data;
                const tbody = document.getElementById('tasksBody');
                tbody.innerHTML = '';

                if (tasks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">Aucune tâche</td></tr>';
                    return;
                }

                for (const task of tasks) {
                    const assignedName = task.assignedTo?.fullName || 'Non assignée';
                    tbody.innerHTML += `
                        <tr>
                            <td>${task.title}</td>
                            <td>${task.priority}</td>
                            <td>
                                <select class="status-select" data-id="${task._id}" onchange="updateStatus('${task._id}', this.value)">
                                    <option value="à faire" ${task.status === 'à faire' ? 'selected' : ''}>À faire</option>
                                    <option value="en cours" ${task.status === 'en cours' ? 'selected' : ''}>En cours</option>
                                    <option value="terminé" ${task.status === 'terminé' ? 'selected' : ''}>Terminé</option>
                                </select>
                            </td>
                            <td>${assignedName}</td>
                            <td><button class="btn-danger" onclick="deleteTask('${task._id}')">Supprimer</button></td>
                        </tr>
                    `;
                }
            } catch (err) {
                document.getElementById('tasksBody').innerHTML = '<tr><td colspan="5">Erreur chargement</td></tr>';
            }
        }

        async function updateStatus(taskId, newStatus) {
            try {
                await axios.patch(`/api/tasks/${taskId}/status`, { status: newStatus });
                document.getElementById('message').innerHTML = '<span class="success">Statut mis à jour ✅</span>';
                loadTasks();
                setTimeout(() => document.getElementById('message').innerHTML = '', 2000);
            } catch (err) {
                alert('Erreur: ' + (err.response?.data?.msg || err.message));
                loadTasks(); // refresh to revert select
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Supprimer cette tâche ?')) return;
            try {
                await axios.delete(`/api/tasks/${taskId}`);
                document.getElementById('message').innerHTML = '<span class="success">Tâche supprimée ✅</span>';
                loadTasks();
            } catch (err) {
                alert('Erreur suppression');
            }
        }

        loadTasks();
    </script>
</body>
</html>
